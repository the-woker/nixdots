[bind.default]
"SUPER+Return" = "spawn,ghostty"
"SUPER+Space" = "spawn_shell, pkill wofi || wofi"
"SUPER+r" = "reload_config"
"SUPER+b" = "spawn,zen"
"SUPER+e" = "spawn,ghostty -e zsh -c \"yazi; exec $SHELL\""
"SUPER+t" = "spawn,ghostty -e zsh -c \"nvim; exec $SHELL\""

"SUPER+ALT+Tab" = "focusstack,next"
"SUPER+SHIFT+s" = "spawn, grim -g \"$(slurp)\" \"/home/$USER/Screenshots/$(date \"+%Y-%m-%d %H:%M:%S\").png\""
"SUPER+c" = "spawn, ghostty -e zsh -c \"cd ~/nixdots && nvim .; exec $SHELL\""
"SUPER+SHIFT+c" = "spawn, ghostty -e zsh -c \"cd ~/.config/mango && nvim .; exec $SHELL\""
"SUPER+ALT+SHIFT+q" = "spawn,shutdown -h now"
"SUPER+ALT+SHIFT+r" = "spawn,reboot"
"SUPER+ALT+k" = "spawn,killall neko-mangowm"

"SUPER+m" = "quit"
"SUPER+q" = "killclient"
"SUPER+h" = "focusdir,left"
"SUPER+j" = "focusdir,down"
"SUPER+k" = "focusdir,up"
"SUPER+l" = "focusdir,right"

"SUPER+SHIFT+h" = "exchange_client,left"
"SUPER+SHIFT+j" = "exchange_client,down"
"SUPER+SHIFT+k" = "exchange_client,up"
"SUPER+SHIFT+l" = "exchange_client,right"

"SUPER+g" = "toggleglobal"
"ALT+Tab" = "toggleoverview"
"SUPER+f" = "togglefullscreen"

"CTRL+SUPER+Left" = "tagtoleft,0"
"CTRL+SUPER+Right" = "tagtoright,0"

"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"

"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"
"SUPER+SHIFT+8" = "tag,8,0"
"SUPER+SHIFT+9" = "tag,9,0"

"none+XF86AudioRaiseVolume" = "spawn,wpctl set-volume @DEFAULT_SINK@ 2%+"
"none+XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_SINK@ 2%-"
"none+XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_SINK@ toggle"
"none+XF86AudioPlay" = "spawn,playerctl play-pause"
"none+XF86AudioStop" = "spawn,playerctl stop"
"none+XF86AudioNext" = "spawn,playerctl next"
"none+XF86AudioPrev" = "spawn,playerctl previous"

"ALT+h" = "movewin,-50+0"
"ALT+j" = "movewin,+0,+50"
"ALT+k" = "movewin,+0,-50"
"ALT+l" = "movewin,+50,+0"

"CTRL+Alt+Up" = "resizewin,+0,-50"
"CTRL+Alt+Down" = "resizewin,+0,+50"
"CTRL+Alt+Left" = "resizewin,-50,+0"
"CTRL+Alt+Right" = "resizewin,+50,+0"

"SUPER+Tab" = "viewtoright"
"SUPER+SHIFT+Tab" = "viewtoleft"
